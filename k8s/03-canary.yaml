# Canary: 3 stable pods + 1 canary pod behind one Service => ~25% of traffic reaches the new version. Rollback = scale canary to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  labels:
    strategy: aceest-canary
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
    spec:
      containers:
        - name: app
          image: docker.io/sh00010111/aceest-fitness:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 160Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  labels:
    strategy: aceest-canary
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      containers:
        - name: app
          image: docker.io/sh00010111/aceest-fitness:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
