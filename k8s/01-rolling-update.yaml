# Rolling Update: replaces pods gradually (maxUnavailable 0 => zero downtime). Rollback: kubectl rollout undo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    strategy: aceest-rolling
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
    spec:
      containers:
        - name: app
          image: docker.io/sh00010111/aceest-fitness:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
spec:
  type: NodePort
  selector:
    app: aceest-rolling
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
