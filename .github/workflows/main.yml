name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: aceest-fitness

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check (syntax errors)
        run: python -m py_compile app.py db.py fitness.py
      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t $IMAGE_NAME:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name aceest -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 15); do curl -fs http://localhost:5000/health && exit 0; sleep 2; done
          docker logs aceest; exit 1
      - name: Image size
        run: docker images $IMAGE_NAME

  test:
    name: Automated Testing (in container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t $IMAGE_NAME-test:${{ github.sha }} .
      - name: Run Pytest inside container
        run: docker run --rm $IMAGE_NAME-test:${{ github.sha }} python -m pytest -q --cov=. --cov-report=term-missing
